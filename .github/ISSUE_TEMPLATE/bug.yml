name: Bug
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you see, and what did you expect? }
    validations: { required: true }
  - type: input
    id: build
    attributes: { label: Build, description: The build id in the bottom-right corner of the page }
  - type: input
    id: browser
    attributes: { label: Browser and device }
